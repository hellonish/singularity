# EC2 production stack. PostgreSQL and report objects live in Supabase; the
# frontend lives in Vercel.
#
# Validate:
#   docker compose --env-file .env.production -f docker-compose.prod.yml config
# Deploy:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 96M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320M
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction

  migrate:
    image: ${API_IMAGE:-singularity/singularity-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    env_file:
      - .env.production
    environment:
      SINGULARITY_AUTO_CREATE_SCHEMA: "false"
    command: alembic upgrade head
    restart: "no"

  api:
    image: ${API_IMAGE:-singularity/singularity-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      SINGULARITY_AUTO_CREATE_SCHEMA: "false"
      SINGULARITY_RESEARCH_WORKER_ENABLED: "true"
      SINGULARITY_LOG_FILE: /app/logs/api.log
    volumes:
      - application_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ${API_IMAGE:-singularity/singularity-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
      SINGULARITY_AUTO_CREATE_SCHEMA: "false"
      SINGULARITY_RESEARCH_WORKER_ENABLED: "true"
      SINGULARITY_LOG_FILE: /app/logs/worker.log
    volumes:
      - application_logs:/app/logs
    command: arq api.research_worker.WorkerSettings
    # The image-level health check probes the FastAPI HTTP server, which this
    # ARQ-only process deliberately does not run. Process liveness is covered
    # by the restart policy and worker logs/job metrics.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  application_logs:
